<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="to-header">
    <h1>Turnout</h1>
    <p class="to-tagline">Brands pay only for people who showed up.</p>
    <p class="to-status" id="status">Checking setup…</p>
  </header>

  <ol class="to-timeline" aria-label="Steps">
    <li class="is-current">Request</li>
    <li>Approve</li>
    <li>Hold</li>
    <li>Event day</li>
    <li>Payouts</li>
    <li>Proof</li>
  </ol>

  <main class="to-panels">
    <section class="to-panel" aria-labelledby="brand-title">
      <h2 id="brand-title">Brand</h2>
      <p class="to-empty">The brand's goal and budget go here.</p>
    </section>
    <section class="to-panel" aria-labelledby="community-title">
      <h2 id="community-title">Communities</h2>
      <p class="to-empty">Matched communities and check-ins go here.</p>
    </section>
    <section class="to-panel" aria-labelledby="payouts-title">
      <h2 id="payouts-title">Payouts</h2>
      <p class="to-empty">The PayPal hold and payout ledger go here.</p>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
